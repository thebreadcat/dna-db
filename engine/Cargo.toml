[package]
name = "dnadb-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Core DNA-DB engine implementation."

[lib]
name = "dnadb_engine"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
thiserror = "2.0"
memmap2 = "0.9"
rayon = "1.10"
uuid = { version = "1.10", features = ["v4", "serde"] }
blake3 = "1.5"
serde_json = "1.0"
crc32fast = "1.4"

# Optional: HTTP lab server (`dnadb_http` binary)
axum = { version = "0.7", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"], optional = true }
tower-http = { version = "0.5", features = ["cors", "fs"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.20"
proptest = "1.6"

[[bench]]
name = "stage1_encode"
harness = false

[[bin]]
name = "dnadb_http"
path = "src/bin/dnadb_http.rs"
required-features = ["http_server"]

[features]
default = []
http_server = ["dep:axum", "dep:tokio", "dep:tower-http", "dep:clap"]
