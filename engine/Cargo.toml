[package]
name = "dnadb-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Core DNA-DB engine implementation."

[lib]
name = "dnadb_engine"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
thiserror = "2.0"
memmap2 = "0.9"
rayon = "1.10"
uuid = { version = "1.10", features = ["v4", "serde"] }
blake3 = "1.5"
serde_json = "1.0"
crc32fast = "1.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.20"
proptest = "1.6"

[[bench]]
name = "stage1_encode"
harness = false
