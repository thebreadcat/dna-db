version: "3.9"

services:
  dnadb:
    image: dnadb/server:latest
    container_name: dnadb
    restart: unless-stopped
    ports:
      - "4737:4737"
      - "27017:27017"
      - "5432:5432"
      - "8080:8080"
      - "8443:8443"
      - "9464:9464"
    volumes:
      - ./config/dnadb.config.toml.example:/etc/dnadb/config.toml:ro
      - dnadb-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: dnadb-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./docs/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    container_name: dnadb-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  dnadb-data:
